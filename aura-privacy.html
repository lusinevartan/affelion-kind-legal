<h1>How Aura uses your data.</h1><p class="updated">Affelion Aura for iOS and Android · Draft, not yet published</p>
</header>
<section><h2>What Aura measures</h2>
<p>Affelion LLC provides Aura. Aura reads your pulse and heart-rate variability from a fingertip on the rear camera with the flash on, maps your outline with the front camera, and analyses about five seconds of your voice for pitch, variance and stability. It translates those numbers into a colour portrait. It does not detect energy fields, make predictions or diagnose anything. It is not a medical device.</p>
<p>Camera frames and audio are processed on your device while a scan runs and are then discarded. Aura does not record video, keep audio, transcribe your voice or upload any of it.</p></section>
<section><h2>On your device</h2>
<p>Aura keeps the numbers from each scan (heart rate, variability, voice statistics), the portrait settings those numbers produce, the still photo shown under your portrait, practice session results, and your settings. All of it stays on your phone in the app's storage, subject to your device's backup rules. Deleting all data in Settings removes it from the app. Aura does not erase device backups.</p>
<p>Portraits leave your device only when you save them to your photo library or share them. What you share follows the rules of the service you share to.</p></section>
<section><h2>Sasha, the guide</h2>
<p>Sasha answers questions about your portrait. If the build you use connects Sasha to our server, the app sends your question and the numbers from that scan (heart rate, variability, voice statistics, the colours chosen) to a server we run, which forwards them to an AI model provider to compose the reply. No images, audio or names are sent. We do not store these requests. The provider processes them under its own rules.</p>
<p>Without a server connection, Sasha answers from wording built into the app and nothing leaves your device.</p></section>
<section><h2>The stores</h2>
<p>Apple and Google handle prices, purchases and restores. Aura checks your access with the store, through a subscription service, when it opens and when access may have changed. These checks may need internet access and include a random app-installation identifier, never your scan data. We do not receive your card details. You do not have to buy to use the free scans.</p></section>
<section><h2>When you email us</h2>
<p>If you email <a class="contact" href="mailto:hello@affelion.com">hello@affelion.com</a>, we receive your sender name, address, message and files. We use them only to handle your request. Google hosts our support mail. Only Aura's owner reads support mail, and we keep it until the owner deletes it by hand.</p>
<p>Please do not send health records, passwords or card details. Support is for the app, purchases and privacy. It is not an emergency or health care service.</p></section>
<section><h2>How we use data</h2><p>We do not use support mail for ads, marketing lists or user profiles. Aura has no added analytics or tracking tools. Apple and Google may process store and device data under their own rules.</p></section>
<section><h2>Your choice</h2>
<p>Email us to ask about access to your support data, a correction or deletion. Your scan data is on your device and under your control. Your rights depend on the law that applies. Aura does not ask for your birth date or ID. We will update this notice when our practices change.</p></section>
