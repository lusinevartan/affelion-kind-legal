<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Affelion Aura renderer harness</title>
<style>
  html, body { margin: 0; background: #0b0c10; }
  #stage { position: relative; width: 540px; height: 720px; }
  #bg, #gl { position: absolute; inset: 0; width: 540px; height: 720px; }
  #status { position: absolute; left: 8px; top: 8px; color: #666; font: 12px system-ui; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="bg" width="540" height="720"></canvas>
    <canvas id="gl" width="540" height="720"></canvas>
    <div id="status">loading</div>
  </div>
  <script src="harness.js"></script>
</body>
</html>
