<h1>Help with Aura.</h1><p class="updated">Affelion Aura for iOS and Android · Draft, not yet published</p>
</header>
<section><h2>Getting a good pulse reading</h2>
<p>Rest your fingertip over the rear camera and the flash together. Press lightly: too much pressure blocks blood flow and the signal fades. Keep your hand still, ideally with your elbow resting on something. The flash will feel slightly warm; that is normal. If the app says "cover the flash too", shift your finger so it covers both the lens and the light.</p></section>
<section><h2>The voice step</h2>
<p>Speak or hum at a normal volume for about five seconds. Aura measures pitch, variance and stability; it does not record or transcribe what you say. You can skip the voice step; the portrait then comes from your pulse alone and says so.</p></section>
<section><h2>What the colours mean</h2>
<p>Every colour in a portrait maps to a measured number through a fixed set of rules. Tap a marker on the portrait, or open the full breakdown, to see which measurement produced which colour. The same numbers always produce the same portrait.</p></section>
<section><h2>Practice</h2>
<p>Practice is paced breathing with your finger on the camera while the portrait follows your heart rhythm live. What it trains is heart-rate variability and coherence. Stop if you feel light-headed and breathe normally. Aura is not a medical device; for health concerns, speak with a clinician.</p></section>
<section><h2>Purchases and cancelling</h2>
<p>Subscriptions renew until cancelled. Cancel any time from your App Store or Google Play subscriptions, also reachable from Settings in the app; access continues to the end of the paid period. Use Restore in Settings or on the plans page if Pro does not show after reinstalling. For refunds, Apple and Google handle them under their rules.</p></section>
<section><h2>Your data</h2>
<p>Scan data stays on your device. Settings has a Delete all data button that removes every scan, portrait and setting from the app. See the <a href="aura-privacy.html">privacy notice</a> for details.</p></section>
